[Unit]
# Retire the AppleDeck-era generated drop-in before audio-layout regenerates
# under the new name. Wants (not Requires): migration failure must not stop
# audio; After= orders the ExecStartPre below behind it.
Wants=brinewell-migrate-user-state.service
After=brinewell-migrate-user-state.service

[Service]
# SteamOS platform defaults force stereo. Follow the virtual card's boot layout.
ExecStartPre=-/usr/lib/brinewell/audio-layout
